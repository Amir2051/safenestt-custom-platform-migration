[project]
name = "safenestt-custom-platform"
version = "0.1.0"
description = "Custom SafeNestT backend built to replace Base44 incrementally."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
